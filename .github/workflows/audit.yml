name: PepperCipher Browser Audit

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/audit.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: peppercipher-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: npm install --no-save playwright@1.56.1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check test script syntax
        run: node --check tests/browser-audit.cjs

      - name: Start local server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/peppercipher-http.log 2>&1 &
          for n in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/index.html > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/peppercipher-http.log
          exit 1

      - name: Run Chromium end-to-end audit
        run: node tests/browser-audit.cjs

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peppercipher-browser-audit-report
          path: audit-report.json
          if-no-files-found: warn
          retention-days: 30
